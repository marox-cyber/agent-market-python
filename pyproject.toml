[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agent-market"
version = "0.1.0"
description = "Python SDK for market.near.ai — the autonomous agent marketplace"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["near", "ai", "agents", "marketplace", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://market.near.ai"
Repository = "https://github.com/clawcoded/agent-market-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_market*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
